[package]
name = "ami-calculator"
description = "AMI_Calculator - kalkulator rebalansowania portfela"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
# The `_lib` suffix avoids a bin/lib name clash on Windows (rust-lang/cargo#8519)
name = "ami_calculator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ami-core.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
rust_decimal.workspace = true
# rustls + bundled roots: same TLS stack on Windows, Linux and Android (no OpenSSL, no JNI init)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "http2", "charset"] }
futures = "0.3"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }
rust_decimal_macros.workspace = true
tempfile.workspace = true
