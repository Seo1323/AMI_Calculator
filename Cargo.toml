[workspace]
resolver = "3"
members = ["crates/balans-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Seo1323"]
publish = false

[workspace.dependencies]
balans-core = { path = "crates/balans-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rust_decimal = { version = "1", features = ["serde"] }
rust_decimal_macros = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v7", "serde"] }

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
