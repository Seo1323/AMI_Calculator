[workspace]
resolver = "3"
members = ["crates/ami-core", "src-tauri"]

[workspace.package]
version = "0.6.5"
edition = "2024"
authors = ["Seo1323"]
publish = false

[workspace.dependencies]
ami-core = { path = "crates/ami-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rust_decimal = { version = "1", features = ["serde"] }
rust_decimal_macros = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v7", "serde"] }
rusqlite = { version = "0.43", features = ["bundled"] }
tempfile = "3"
proptest = "1"
argon2 = "0.5"
chacha20poly1305 = "0.10"
base64 = "0.22"
getrandom = "0.2"

# Key derivation is deliberately heavy; unoptimised it makes the sync tests take seconds.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
