name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: System deps for Tauri
        run: |
          # The Ubuntu mirror can drop packages between `update` and `install` (404 on a slow
          # download), so retry the whole sequence; fail only after the last attempt.
          for attempt in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y --fix-missing \
              libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf && exit 0
            echo "apt attempt $attempt failed" >&2
            sleep 15
          done
          exit 1
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: cargo test --workspace
      - run: cargo clippy --workspace -- -D warnings
