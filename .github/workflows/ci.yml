name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: System deps for Tauri
        run: |
          # The Ubuntu mirror can drop packages between `update` and `install` (404 on a slow
          # download), so retry the whole sequence; fail only after the last attempt.
          for attempt in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y --fix-missing \
              libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf && exit 0
            echo "apt attempt $attempt failed" >&2
            sleep 15
          done
          exit 1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: cargo fmt --all --check
      - run: cargo test --workspace
      - run: cargo clippy --workspace -- -D warnings
      - name: Audit dependencies
        run: cargo install cargo-audit --locked && cargo audit --deny warnings --ignore RUSTSEC-2024-0370 --ignore RUSTSEC-2024-0429 --ignore RUSTSEC-2026-0543
