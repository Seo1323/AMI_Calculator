name: Release

# `npm run release 0.2.0` pushes tag v0.2.0, which builds every installer into a
# draft GitHub release. Review it and click "Publish".
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$TAG" -f name="AMI_Calculator $TAG" -F body=@.github/release-notes.md \
            -F draft=true -F prerelease=true --jq .id)
          test -n "$id" || { echo "release id is empty"; exit 1; }
          echo "Created draft release $id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  desktop:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: System deps for Tauri (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          # The Ubuntu mirror can drop packages between `update` and `install` (404 on a slow
          # download), so retry the whole sequence; fail only after the last attempt.
          for attempt in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y --fix-missing \
              libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf && exit 0
            echo "apt attempt $attempt failed" >&2
            sleep 15
          done
          exit 1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: npm ci
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.id }}
          tagName: ${{ github.ref_name }}

  android:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      # GitHub's Ubuntu runners ship the Android SDK and NDK preinstalled.
      - name: Use preinstalled NDK
        run: |
          test -d "$ANDROID_NDK_LATEST_HOME"
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "Using NDK $ANDROID_NDK_LATEST_HOME, SDK $ANDROID_HOME"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: npm ci
      - name: Generate Android project
        run: test -d src-tauri/gen/android || npm run tauri android init -- --ci
      - name: Apply system bar insets
        run: cp scripts/android/MainActivity.kt src-tauri/gen/android/app/src/main/java/com/seo1323/amicalculator/MainActivity.kt
      - name: Configure signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          python3 scripts/android-signing.py
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          {
            echo "keyAlias=$KEY_ALIAS"
            echo "password=$KEYSTORE_PASSWORD"
            echo "storeFile=$RUNNER_TEMP/release.p12"
          } > src-tauri/gen/android/keystore.properties
      - name: Build APK
        run: npm run tauri android build -- --apk --target aarch64
      - name: Upload APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          RELEASE_ID: ${{ needs.create-release.outputs.id }}
        run: |
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' | head -1)
          test -n "$apk" || { echo "no APK found"; exit 1; }
          out="AMI_Calculator_${TAG#v}_arm64.apk"
          cp "$apk" "$out"
          gh api -X POST -H "Content-Type: application/vnd.android.package-archive" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$out" \
            --input "$out" --jq .browser_download_url
